# 用 XcodeGen 生成 Kai.xcodeproj（我在服务器上生成好了，提交进仓库，你在 Mac 上直接双击打开就行）。
name: Kai
options:
  bundleIdPrefix: com.sarahlittlefish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Kai:
    type: application
    platform: iOS
    sources:
      - path: Kai
      # 人设和个人档案：直接用仓库根目录的原文文件，网页版和 app 共用同一份，一字不改。
      - path: ../kai_persona_v2.md
        buildPhase: resources
        group: Persona
      - path: ../kai_profile.md
        buildPhase: resources
        group: Persona
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarahlittlefish.kaichat
        PRODUCT_NAME: Kai
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "@/"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
